<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="PPAS Logo">
  <!-- Outer border ring -->
  <circle cx="100" cy="100" r="98" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <!-- Main green fill circle -->
  <circle cx="100" cy="100" r="90" fill="#16a34a"/>
  <!-- Subtle inner ring separator for text area -->
  <circle cx="100" cy="100" r="70" fill="#14912e"/>

  <!-- PPAS centred text -->
  <text
    x="100"
    y="118"
    text-anchor="middle"
    fill="white"
    font-size="50"
    font-weight="900"
    font-family="Arial Black, Arial, sans-serif"
    letter-spacing="1"
  >PPAS</text>

  <!-- Circular text path (radius 80, full circle clockwise starting at left) -->
  <path
    id="circleRing"
    fill="none"
    stroke="none"
    d="M 20,100 A 80,80 0 1,1 180,100 A 80,80 0 1,1 20,100"
  />

  <text
    fill="white"
    font-size="9.2"
    font-weight="700"
    font-family="Arial, Helvetica, sans-serif"
    letter-spacing="2.6"
  >
    <textPath href="#circleRing" startOffset="5%">PROCUREMENT PROCESS AUTOMATION SYSTEM</textPath>
  </text>
</svg>
